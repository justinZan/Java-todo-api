# 第 27 周 Kafka profile：仅在本机或部署环境已经运行 Kafka 时启用。
# 启动示例：KAFKA_BOOTSTRAP_SERVERS=localhost:9092 mvn spring-boot:run -Dspring-boot.run.profiles=kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# 生产者把消息 key 和消息体分别序列化为字符串和 JSON。
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# 消费者使用同一个 group 共同消费 Topic；同一组内一条消息只会分配给一个消费者实例。
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:java-todo-api}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.zading.todoapi.messaging.TodoActionLogMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.zading.todoapi.messaging
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# Kafka profile 已明确依赖 Kafka，因此开启 Kafka 健康检查。
management.health.kafka.enabled=true
