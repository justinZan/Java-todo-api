# 第十九周：开发环境配置。
# 启动方式：
# mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# dev profile 会先加载 application.properties，再用这里的同名配置覆盖它。
# 它面向本地开发：日志更详细、保留 H2 Console、请求日志开启。

# 开发时查看 Hibernate 生成的 SQL，并使用多行格式阅读。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 开发时保留 H2 Console，方便查看表和数据。
spring.h2.console.enabled=true

# 开发环境开启 requestId 请求日志。
app.request-logging.enabled=true
app.request-logging.request-id-header=X-Request-Id

# DEBUG 会记录更多业务代码日志；生产环境不要随意开启 DEBUG。
logging.level.com.zading.todoapi=DEBUG
logging.level.org.springframework.security=INFO

# 健康检查不返回内部组件详细信息。
management.endpoint.health.show-details=never
# 没有 Redis 时关闭 Redis 健康检查，避免健康状态被 Redis 连接影响。
management.health.redis.enabled=false

# 本地附件保存到项目工作目录下的 uploads/。
app.file-storage.root-location=uploads
# 5 MiB，单位是字节。
app.file-storage.max-file-size-bytes=5242880
