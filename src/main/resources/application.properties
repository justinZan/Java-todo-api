spring.application.name=java-todo-api
server.port=8080

# 默认使用 H2 文件数据库：电脑没装 PostgreSQL 也能直接运行。
# 数据文件会生成在项目的 data/ 目录下，并已加入 .gitignore。
spring.datasource.url=jdbc:h2:file:./data/todo-db-v2;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 第六周开始由 Flyway 负责建表和改表，JPA 只负责校验 Entity 和表结构是否匹配。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
