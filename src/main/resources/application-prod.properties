# 第十九周：生产环境配置示例。
# 启动方式：
# java -jar target/java-todo-api-1.0.0.jar --spring.profiles.active=prod
#
# prod profile 会覆盖 application.properties 中的同名配置。
# 它面向真实部署：使用 PostgreSQL、关闭开发工具，并要求敏感配置通过环境变量注入。

# 下面三个配置没有默认值，启动生产环境时必须提供对应环境变量。
# 如果应用运行在 Compose 中，DB_URL 由 docker-compose.yml 注入 postgres 服务地址。
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 生产环境不输出 SQL，避免日志过多或意外记录敏感参数。
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# H2 Console 只服务于本地学习，生产环境关闭。
spring.h2.console.enabled=false

# 生产环境必须提供 JWT_SECRET，不能使用默认学习密钥。
app.jwt.secret=${JWT_SECRET}
# 没有提供过期时间时，仍使用 120 分钟。
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# 生产环境保留 requestId，方便关联请求日志。
app.request-logging.enabled=true
app.request-logging.request-id-header=X-Request-Id

# 生产环境只记录必要信息；Security 使用 WARN 减少噪声。
logging.level.com.zading.todoapi=INFO
logging.level.org.springframework.security=WARN

# 暴露健康检查探针，但不返回内部组件详细信息。
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# 如果没有启用 Redis，健康检查不要等待 Redis。
management.health.redis.enabled=false

# 生产环境附件目录通过 FILE_STORAGE_ROOT 配置，默认仍是 uploads/。
app.file-storage.root-location=${FILE_STORAGE_ROOT:uploads}
# 单个附件最大值由 FILE_STORAGE_MAX_FILE_SIZE_BYTES 控制，默认 5 MiB。
app.file-storage.max-file-size-bytes=${FILE_STORAGE_MAX_FILE_SIZE_BYTES:5242880}
