# 测试 profile 只在测试运行时加载，不影响本地开发和生产配置。
# 使用 H2 内存数据库，测试结束后数据随 JVM 消失，不会污染 data/ 目录。
# DB_CLOSE_DELAY=-1 让数据库在连接关闭后继续存在到 JVM 结束，适合 Spring 测试上下文。
spring.datasource.url=jdbc:h2:mem:todo_api_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
# 测试使用 H2 驱动。
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 测试也使用 validate，确保 Entity 和 Flyway 创建的表结构一致。
spring.jpa.hibernate.ddl-auto=validate
# 测试阶段输出 SQL，便于学习和排查失败原因。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 强制测试在明确的事务边界内访问数据库。
spring.jpa.open-in-view=false

# 测试环境执行完整 Flyway 迁移，验证迁移脚本本身可用。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 使用本地内存缓存，测试不依赖 Redis。
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# 测试使用固定 JWT secret，避免依赖本机环境变量。
app.jwt.secret=test-jwt-secret-for-java-todo-api-learning-1234567890
# 测试 Token 默认有效 120 分钟。
app.jwt.expiration-minutes=120

# 测试不输出请求日志，减少测试控制台噪声。
app.request-logging.enabled=false
app.request-logging.request-id-header=X-Request-Id

# 关闭定时任务，避免后台任务和测试数据互相影响。
app.todo.overdue-job.enabled=false
# 测试仍然验证 Actuator 探针配置能够加载。
management.endpoint.health.probes.enabled=true
# 没有 Redis 时关闭 Redis 健康检查。
management.health.redis.enabled=false

# 测试附件写入 target/test-uploads，测试公共基类会在每个测试前清理。
app.file-storage.root-location=target/test-uploads
# 测试单个附件最大 1 MiB。
app.file-storage.max-file-size-bytes=1048576
