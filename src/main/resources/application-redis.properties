# 第十五周：Redis 缓存 profile。
# 默认 application.properties 仍然使用 Simple Cache；只有启动 redis profile 时才启用 Redis。
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=redis
# 启用后，Spring Cache 的底层存储从当前 JVM 内存切换为 Redis。
spring.cache.type=redis

# 本地 Redis 默认连接信息。当前不要求你的电脑已经安装 Redis。
# 如果 Redis 在 Docker Compose 或其他主机中运行，需要修改 REDIS_HOST。
spring.data.redis.host=${REDIS_HOST:localhost}
# Redis 默认端口是 6379。
spring.data.redis.port=${REDIS_PORT:6379}
# 没有密码时为空；有密码时通过 REDIS_PASSWORD 环境变量注入。
spring.data.redis.password=${REDIS_PASSWORD:}
# 建立 Redis 连接最多等待 2 秒，避免 Redis 不可用时请求长时间阻塞。
spring.data.redis.timeout=2s

# 当前项目只使用 Redis 作为缓存，不使用 Spring Data Redis Repository。
spring.data.redis.repositories.enabled=false

# 启用 redis profile 时，Actuator health 会检查 Redis 连接；因此 Redis 不可用时健康状态可能变为异常。
management.health.redis.enabled=true
