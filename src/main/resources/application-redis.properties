# 第十五周：Redis 缓存 profile。
# 默认 application.properties 仍然使用 Simple Cache；只有启动 redis profile 时才启用 Redis。
spring.cache.type=redis

# 本地 Redis 默认连接信息。当前不要求你的电脑已经安装 Redis。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# 当前项目只使用 Redis 作为缓存，不使用 Spring Data Redis Repository。
spring.data.redis.repositories.enabled=false

# 启用 redis profile 时，Actuator health 会检查 Redis 连接。
management.health.redis.enabled=true
