# 应用名称，会显示在 Spring Boot 日志中，也可以被 Actuator 等组件读取。
spring.application.name=java-todo-api

# 应用监听的 HTTP 端口；浏览器访问地址通常是 http://localhost:8080。
server.port=8080

# 默认使用 H2 文件数据库，因此电脑没装 PostgreSQL 也能直接运行。
# ./data/todo-db-v2 是数据库文件位置；MODE=PostgreSQL 让 H2 尽量兼容 PostgreSQL 语法。
# 数据文件会生成在项目的 data/ 目录下，并已加入 .gitignore。
spring.datasource.url=jdbc:h2:file:./data/todo-db-v2;MODE=PostgreSQL
# H2 JDBC 驱动类；切换到 PostgreSQL profile 后会被 PostgreSQL 驱动覆盖。
spring.datasource.driver-class-name=org.h2.Driver
# H2 默认用户名。H2 学习环境没有密码，所以这里为空。
spring.datasource.username=sa
spring.datasource.password=

# 第六周开始由 Flyway 负责建表和改表，JPA 只负责校验 Entity 和表结构是否匹配。
# validate 不会自动创建或修改表，数据库结构必须通过 db/migration 中的脚本维护。
spring.jpa.hibernate.ddl-auto=validate
# 是否把 Hibernate 生成的 SQL 输出到日志；默认学习配置开启，生产配置会关闭。
spring.jpa.show-sql=true
# 将生成的 SQL 格式化成多行，方便学习和排查查询问题。
spring.jpa.properties.hibernate.format_sql=true
# 关闭 Open Session in View，避免 Controller 层隐式访问懒加载对象。
# 这样可以更早暴露事务边界问题，让数据库访问集中在 Service 层事务中。
spring.jpa.open-in-view=false

# 开启 Flyway 数据库迁移。
spring.flyway.enabled=true
# Flyway 从 classpath 下的 db/migration 目录按 V1、V2、V3... 顺序执行脚本。
spring.flyway.locations=classpath:db/migration

# 第十四周：使用 Spring Boot Simple Cache，本地内存缓存，不依赖 Redis。
# 该缓存只存在于当前 JVM，应用重启或多实例部署时不会共享。
spring.cache.type=simple
# 当前项目只使用 Redis 作为缓存，不使用 Spring Data Redis Repository。
spring.data.redis.repositories.enabled=false

# 开启 H2 Console，方便学习时查看数据库；生产 profile 会关闭。
spring.h2.console.enabled=true
# H2 Console 的访问路径：http://localhost:8080/h2-console。
spring.h2.console.path=/h2-console

# 第八周：JWT 学习版配置。真实生产环境应该通过环境变量注入更安全的密钥。
# ${JWT_SECRET:xxx} 的意思是：优先读取 JWT_SECRET，没有提供时使用冒号后的默认值。
# JWT secret 至少要有足够长度，生产环境不要使用仓库中的学习版默认值。
app.jwt.secret=${JWT_SECRET:java-todo-api-learning-secret-change-me-at-least-32-chars}
# Token 有效期，单位是分钟；这里默认 120 分钟。
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# 第九周：接口文档和请求日志。
# OpenAPI JSON 文档地址：http://localhost:8080/v3/api-docs。
springdoc.api-docs.path=/v3/api-docs
# Swagger UI 地址：http://localhost:8080/swagger-ui.html。
springdoc.swagger-ui.path=/swagger-ui.html

# 是否记录每个 HTTP 请求的 requestId；requestId 便于把一次请求串联到日志中。
app.request-logging.enabled=true
# 请求日志过滤器读取和返回的请求头名称。
app.request-logging.request-id-header=X-Request-Id
# 业务包的日志级别；INFO 会记录主要运行信息，dev profile 会覆盖为 DEBUG。
logging.level.com.zading.todoapi=INFO
# Spring Security 的日志级别。
logging.level.org.springframework.security=INFO

# 第十八周：Actuator 基础可观测性端点。
# 只暴露指定的 Actuator 端点，避免默认暴露过多运维信息。
management.endpoints.web.exposure.include=health,info,metrics
# 不向匿名访问者返回数据库等健康组件的详细信息。
management.endpoint.health.show-details=never
# 开启 Kubernetes/容器常用的 liveness 和 readiness 探针。
management.endpoint.health.probes.enabled=true
# 默认没有 Redis 服务，关闭 Redis 健康检查，否则会影响默认健康状态。
management.health.redis.enabled=false
# 默认使用内存消息发布器；本机未启动 Kafka/RabbitMQ 时，不应让健康检查尝试连接它们。
management.health.kafka.enabled=false
management.health.rabbit.enabled=false
# 允许 info 端点读取 info.* 配置项。
management.info.env.enabled=true
# info 端点展示的应用基本信息。
info.app.name=java-todo-api
info.app.version=1.0.0
info.app.description=Spring Boot Todo REST API
info.app.java-version=21

# 第十七周：定时扫描已过期但未完成的 Todo，并记录 OVERDUE 操作日志。
# 是否启用定时任务；cron 使用 6 段 Spring cron 表达式，当前每天 09:00 执行。
app.todo.overdue-job.enabled=true
app.todo.overdue-job.cron=0 0 9 * * *
# 定时任务计算“今天”的时区。
app.todo.overdue-job.zone=Asia/Shanghai
# 批处理每页最多读取的 Todo 数量，避免一次加载太多数据。
app.todo.overdue-job.page-size=50

# 第二十周：Todo 附件本地存储配置。
# 相对路径相对于应用工作目录；Docker profile 会注入 /app/uploads。
app.file-storage.root-location=uploads
# 单个附件最大 5 MiB，单位是字节。
app.file-storage.max-file-size-bytes=5242880

# 第二十六周：Redis 深入实践。
# 没有启用 redis profile 时，以下参数供单 JVM 内存实现使用；启用后由 Redis 实现使用。
# 分布式锁租期，避免持锁进程崩溃后锁永久存在。
app.redis.lock-lease=5m
# 幂等 Key 保存时间；超过 TTL 后，同一个 Key 会被视为新请求。
app.redis.idempotency-ttl=10m
# 固定窗口限流的时间范围。
app.redis.rate-limit-window=1m
# 同一个用户名每分钟最多登录 5 次。
app.redis.login-limit=5
# 同一个用户每分钟最多创建 30 个 Todo。
app.redis.todo-create-limit=30

# 第 27 周：消息队列统一配置。默认使用内存发布器，不连接 Kafka 或 RabbitMQ。
# 启用 kafka profile 时使用 app.messaging.kafka.*；启用 rabbitmq profile 时使用 app.messaging.rabbit.*。
app.messaging.kafka.topic=todo-action-log
app.messaging.kafka.consumer-group=java-todo-api
# Kafka Topic 的分区和副本数量；本地单节点通常使用 1 个副本。
app.messaging.kafka.partitions=3
app.messaging.kafka.replicas=1
app.messaging.rabbit.exchange=todo.events
app.messaging.rabbit.queue=todo-action-log
app.messaging.rabbit.routing-key=todo.action-log
app.messaging.rabbit.dead-letter-exchange=todo.events.dlx
app.messaging.rabbit.dead-letter-queue=todo-action-log.dlq
app.messaging.rabbit.dead-letter-routing-key=todo.action-log.dlq
# RabbitMQ 消费失败最多尝试 3 次，之后拒绝消息并进入死信队列。
app.messaging.rabbit.retry-attempts=3
app.messaging.rabbit.retry-delay-ms=1000
