# PostgreSQL profile：只在本机已经有 PostgreSQL，或连接 Docker PostgreSQL 时启用。
# 启用方式：
# mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#
# 或者：
# java -jar target/java-todo-api-1.0.0.jar --spring.profiles.active=postgres

# ${变量:默认值} 会优先读取环境变量；冒号后的内容是本地学习默认值。
# 如果应用运行在 Docker Compose 中，DB_URL 应该使用 postgres 服务名，而不是 localhost。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/java_todo_api}
# PostgreSQL JDBC 驱动类。
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL 用户名，默认是 postgres。
spring.datasource.username=${DB_USERNAME:postgres}
# PostgreSQL 密码；这里不写死密码，优先从 DB_PASSWORD 环境变量读取。
spring.datasource.password=${DB_PASSWORD:}

# 只校验 Entity 和数据库结构，不让 Hibernate 自动改表。
spring.jpa.hibernate.ddl-auto=validate
# PostgreSQL profile 为了学习 SQL 暂时开启 SQL 日志；生产 profile 会关闭。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 显式指定 Hibernate 使用 PostgreSQL 方言，帮助生成适配 PostgreSQL 的 SQL。
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 关闭 Open Session in View，要求数据库访问在 Service 事务中完成。
spring.jpa.open-in-view=false

# PostgreSQL 也使用 Flyway 执行同一套数据库迁移。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# PostgreSQL 环境仍然需要 JWT 配置；生产环境应提供强随机密钥。
app.jwt.secret=${JWT_SECRET:java-todo-api-learning-secret-change-me-at-least-32-chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# 开启 requestId 请求日志，便于排查一次请求经过的完整链路。
app.request-logging.enabled=true
app.request-logging.request-id-header=X-Request-Id
# PostgreSQL 本地调试时保留业务和 Security 日志。
logging.level.com.zading.todoapi=INFO
logging.level.org.springframework.security=INFO
